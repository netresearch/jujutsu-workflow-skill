name: Evals

# Continuous PROOF: installs the pinned jj version and runs the deterministic
# eval suites that (a) prove the skill's documented workflow works end-to-end and
# (b) demonstrate jj's superiority over pure Git for agentic coding.
#
# Thin caller of the shared script-check reusable: jj is provisioned in
# `pre-command` (it runs in the same job, so the $GITHUB_PATH entry carries into
# the check), and the two eval suites run as the check. The checkout pin and
# harden-runner are maintained centrally.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  evals:
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      # jj release pin. Kept here (not as a workflow env) because a reusable
      # caller's `with:` cannot read `env:`.
      pre-command: |
        JJ_VERSION=v0.42.0
        mkdir -p "$HOME/.local/bin"
        url="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        tmpd="$(mktemp -d)"
        curl -fsSL "$url" | tar -xz -C "$tmpd"
        install -m755 "$(find "$tmpd" -name jj -type f | head -1)" "$HOME/.local/bin/jj"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      check-cmd: |
        jj --version
        git --version
        bash tests/smoke_test.sh
        bash tests/superiority_evals.sh
